  }
  else if(a==='addkar'){
    var kn=$('#kn').value.trim();if(!kn){toast('Isi nama karyawan');return}
    S.cfg.kar.push({id:uid(),nama:kn,persen:Number($('#kp').value)||0});saveCfg();toast('Karyawan ditambahkan')
  }
}
document.addEventListener('input',function(e){
  var k=e.target.dataset&&e.target.dataset.f;if(!k)return;
  if(k.indexOf('qty:')===0){ui.qty[k.slice(4)]=rv(e.target)}
  else if(k.indexOf('kbj:')===0||k.indexOf('kbk:')===0){var id=k.slice(4),o=ui.kb[id]=ui.kb[id]||{};o[k[2]==='j'?'jml':'ket']=rv(e.target)}
  else if(k==='sp'){ui.sp=rv(e.target);var el=$('#sphasil');if(el)el.innerHTML=spHtml()}
  else if(k==='tkf'||k==='tkm'){ui.tk[k==='tkf'?'fisik':'modal']=rv(e.target);var el2=$('#tkhasil');if(el2)el2.innerHTML=kasHasil()}
  else if(k==='sn'){ui.sn=rv(e.target)}
  else if(k.indexOf('ef:')===0){ui.ef[k.slice(3)]=rv(e.target)}
  else if(k.indexOf(':')<0&&k!=='tkt'){ui.form[k]=rv(e.target);if(k==='dtype'||k==='dval'||k==='harga'){var dh=$('#dhint');if(dh)dh.innerHTML=dHint();var ct=$('#cbtn');if(ct)ct.textContent='Catat '+R(finalH())}if(k==='bayar'||k==='harga'){var kb=$('#kmb');if(kb)kb.innerHTML=kmbInfo()}}
});
document.addEventListener('change',function(e){
  var k=e.target.dataset&&e.target.dataset.f;if(!k)return;var v=rv(e.target);
  if(k==='jenis'){var t=S.cfg.tarif.filter(function(x){return x.id===v})[0];ui.form.jenis=v;ui.form.harga=t?t.harga:0;render()}
  else if(k==='harga'){render()}
  else if(k==='dtype'){render()}
  else if(k==='promon'){S.cfg.promo={on:promo().on,n:Math.max(2,Math.round(Number(v))||10)};saveCfg()}
  else if(k==='tkt'){ui.tk.tgl=v||ymd(new Date());render()}
  else if(k==='restore'){doRestore(e.target)}
  else if(k.indexOf('tarif:')===0){S.cfg.tarif.forEach(function(t){if(t.id===k.slice(6))t.harga=Number(v)||0});saveCfg()}
  else if(k==='wa'){S.cfg.wa=v;saveCfg()}
  else if(k==='kasir'){S.cfg.kasir=v.trim();saveCfg();toast('Nama kasir disimpan')}
  else if(k==='sn'){ui.sn=v;render()}
  else if(k.indexOf('kwa:')===0){S.cfg.kar.forEach(function(x){if(x.id===k.slice(4))x.wa=String(v).trim()});saveCfg()}
  else if(k.indexOf('persen:')===0){S.cfg.kar.forEach(function(x){if(x.id===k.slice(7))x.persen=Math.min(100,Math.max(0,Number(v)||0))});saveCfg()}
});
applyTheme();if(!CLOUD)loadLocal();render();if(CLOUD)startCloud();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

</script>
