<style>
@font-face{font-family:"Poppins";font-weight:500;src:url(Poppins-Medium.ttf) format("truetype")}
@font-face{font-family:"Poppins";font-weight:600 700;src:url(Poppins-Bold.ttf) format("truetype")}
:root{--bg:#F5F9FF;--card:#FFFFFF;--tx:#0A2A52;--mut:#4A6280;--line:#D5E4FB;--bl:#0B63D8;--bl2:#EAF2FE;--dk:#0A4FB0;--warn:#B42318;--warnbg:#FDECEA;--ok:#0F7B3E;--tl:#0B7F70;--tlt:#FFFFFF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1626;--card:#14223A;--tx:#E6EEFB;--mut:#9DB0CC;--line:#2A3957;--bl:#5B9BFF;--bl2:#1B2E4D;--dk:#7FB0FF;--warn:#FF8A80;--warnbg:#3A1E22;--ok:#5FD08F;--tl:#2BC4AE;--tlt:#062B26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1626;--card:#14223A;--tx:#E6EEFB;--mut:#9DB0CC;--line:#2A3957;--bl:#5B9BFF;--bl2:#1B2E4D;--dk:#7FB0FF;--warn:#FF8A80;--warnbg:#3A1E22;--ok:#5FD08F;--tl:#2BC4AE;--tlt:#062B26;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-weight:500;font-size:14px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.3px}h1 span{color:var(--bl)}
h2{font-size:15px;margin:22px 0 10px;font-weight:700}
.sub{color:var(--mut);font-size:12px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi b{display:block;font-size:19px;font-weight:700;margin-top:2px}.kpi small{color:var(--mut);font-size:11.5px}
.kpi.big{grid-column:1/-1;background:linear-gradient(135deg,#0A2A52,#12437F);border-color:#2F5FA8;color:#fff}.kpi.big small{color:#CFE0FA}.kpi.big b{font-size:26px}
.chips{display:flex;gap:4px;background:var(--bl2);border-radius:12px;padding:4px;margin:38px 0 6px;position:relative}
.chips::before{content:"Periode laporan";position:absolute;top:-24px;left:2px;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.chip{flex:1;border:0;background:none;color:var(--mut);border-radius:9px;padding:9px 4px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--tl);color:var(--tlt)}
.chips.jr::before{content:"Jenis laporan"}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.btn{border:0;background:var(--bl);color:#fff;font:inherit;font-weight:700;font-size:14px;padding:12px 16px;border-radius:12px;cursor:pointer}
.btn.sec{background:var(--bl2);color:var(--dk)}.btn.del{background:var(--warnbg);color:var(--warn)}.btn.full{width:100%;margin-top:14px}.btn.sm{padding:8px 12px;font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.btn{flex:none}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.item small{color:var(--mut);display:block;font-size:11.5px}.r{text-align:right;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{color:var(--mut);font-weight:600;text-align:right;padding:6px 4px}td{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px}.bars div{flex:1;text-align:center;font-size:10.5px;color:var(--mut)}.bars i{display:block;background:var(--bl);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.tag{display:inline-block;background:var(--warnbg);color:var(--warn);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.stok{font-size:22px;font-weight:700}
.badge{font-size:11px;color:var(--mut);margin-top:6px}
.top{display:flex;align-items:center;justify-content:flex-start;gap:14px}
.mbtn{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mbtn svg{width:22px;height:22px}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--card);border-right:1px solid var(--line);border-radius:0 28px 28px 0;z-index:31;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-105%);transition:transform .28s ease;visibility:hidden}
#drawer.on{transform:none;visibility:visible}
#drawer .dh{padding:0 10px 18px}
#drawer .dh .sub{word-break:break-all}
#drawer .dl{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
.di{display:flex;align-items:center;gap:16px;width:100%;border:0;background:none;color:var(--tx);font:inherit;font-size:16px;font-weight:500;padding:14px 12px;border-radius:14px;cursor:pointer;text-align:left}
.di.on{background:var(--bl2);color:var(--bl)}
.di.out{color:var(--warn);margin-top:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(32px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.empty{color:var(--mut);text-align:center;padding:14px 0;font-size:13px}
#struk{background:#FFFFFF;color:#111;border:1px dashed #9AA7BA;border-radius:8px;padding:16px;font-family:'Courier New',ui-monospace,monospace;font-size:13px;line-height:1.5;margin:6px 0 4px}
#struk .c{text-align:center}#struk hr{border:0;border-top:1px dashed #666;margin:8px 0}#struk .rw{display:flex;justify-content:space-between;gap:10px}
@media print{body *{visibility:hidden}#struk,#struk *{visibility:visible}#struk{position:absolute;left:0;top:0;width:100%;border:0}}
.paychips{display:flex;gap:4px;background:var(--bl2);border-radius:12px;padding:4px;margin:6px 0 4px}
#qov{position:fixed;inset:0;background:rgba(5,15,30,.94);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
#qov img{max-width:100%;max-height:calc(100% - 150px);border-radius:12px;background:#fff}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><button class="mbtn" id="mbtn" data-a="menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div><h1>NATH <span>WASH</span></h1>
<div class="sub">Monitoring keuangan cuci motor &amp; mobil</div></div></div>
<div id="app" style="margin-top:14px"></div>
<div class="badge" id="mode"></div>
</div>
<div id="scrim" data-a="menux"></div>
<aside id="drawer"><div class="dh"><h1>NATH <span>WASH</span></h1><div class="sub" id="who"></div></div><div class="dl" id="nav"></div></aside>
<div id="qov"></div>
<div id="toast"></div>
<script>
var CLOUD=!!(window.NW_FB&&NW_FB.apiKey&&NW_FB.projectId),ROLE="owner",FS=null,AU=null,me=null,UN=[];
var TABS=[['ring','Ringkasan'],['cuci','Cuci'],['qris','QRIS'],['sabun','Sabun'],['kar','Karyawan'],['ex','Biaya'],['atur','Tarif']];
var ICO={ring:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',cuci:'<path d="M12 3.5c3.5 4.2 5.5 7 5.5 10a5.5 5.5 0 0 1-11 0c0-3 2-5.8 5.5-10z"/>',qris:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2.5v2.5M20 14v.01M14 20h2.5M20 17v3h-2"/>',sabun:'<path d="M10 3h4v3h-4zM9 6h6l1.5 3v10.5a1.5 1.5 0 0 1-1.5 1.5H9a1.5 1.5 0 0 1-1.5-1.5V9z"/><path d="M10 13h4v4h-4z"/>',kar:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4M18 14.5c1.8.9 3 2.8 3 5.5"/>',ex:'<path d="M6 3h12v18l-2.4-1.6L13.2 21 10.8 19.4 8.4 21 6 19.4zM9 8h6M9 12h6M9 16h3"/>',atur:'<path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.5 1.5 0 0 1 0 2.1l-6.4 6.4a1.5 1.5 0 0 1-2.1 0z"/><circle cx="8" cy="8" r="1.3"/>',out:'<path d="M9 3.5H5.5a1.5 1.5 0 0 0-1.5 1.5v14a1.5 1.5 0 0 0 1.5 1.5H9M16 8l4 4-4 4M20 12H9"/>'};
function ico(k){return '<svg class="ic" viewBox="0 0 24 24">'+ICO[k]+'</svg>'}
function menu(o){$('#drawer').classList.toggle('on',o);$('#scrim').classList.toggle('on',o)}
var DEF={tarif:[{id:'mk',nama:'Motor Kecil',harga:15000,tp:'motor'},{id:'mb',nama:'Motor Besar',harga:20000,tp:'motor'},{id:'mobk',nama:'Mobil Kecil',harga:50000,tp:'mobil'},{id:'mobs',nama:'Mobil Sedang',harga:60000,tp:'mobil'},{id:'mobb',nama:'Mobil Besar',harga:70000,tp:'mobil'},{id:'ambal',nama:'Ambal',harga:0,tp:'lain'}],kar:[],sabun:[]};
var S={cfg:JSON.parse(JSON.stringify(DEF)),tx:[],ex:[]};
var ui={tab:'ring',per:'month',del:null,qty:{},form:{jenis:'mk',harga:15000,kid:'',plat:'',pay:'tunai',bayar:'',tgl:ymd(new Date())},dirty:false,auth:CLOUD?'wait':'ready',err:'',struk:null,sn:'',wr:'day',ef:{tgl:ymd(new Date()),ket:'',jml:''}};
var col=null,mode='lokal';
function p2(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function R(n){return 'Rp'+Math.round(n||0).toLocaleString('id-ID')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(s){return document.querySelector(s)}
function toast(m){var t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(function(){t.className=''},2200)}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function inP(t){var d=ymd(new Date());return ui.per==='day'?t.tgl===d:ui.per==='month'?t.tgl.slice(0,7)===d.slice(0,7):true}
function saveLocal(){if(CLOUD)return;try{localStorage.setItem('nw',JSON.stringify(S))}catch(e){toast('Gagal menyimpan data di HP')}}
function loadLocal(){try{var j=JSON.parse(localStorage.getItem('nw')||'null');if(j&&j.cfg){S.cfg=j.cfg;S.cfg.tarif=normT(S.cfg.tarif);S.tx=j.tx||[];S.ex=j.ex||[]}}catch(e){}}
function fbErr(e){var c=e&&e.code||'';toast(c==='permission-denied'?'Akses ditolak: periksa email dan Rules Firestore':(e&&e.message)||'Terjadi kesalahan')}
function cloudSave(){if(!FS)return;var c=S.cfg,cf={tarif:c.tarif,kar:c.kar,wa:c.wa||'',kasir:c.kasir||''},sb={sabun:c.sabun};
  if(ROLE==='owner')FS.doc('nw/cfg').set(cf).catch(fbErr);
  FS.doc('nw/sabun').set(sb).catch(fbErr)}
function saveCfg(){if(CLOUD)cloudSave();else saveLocal();render()}
function addTx(t){S.tx.push(t);if(CLOUD)FS.collection('tx').doc(t.id).set(t).catch(fbErr);else saveLocal();render()}
function delTx(id){S.tx=S.tx.filter(function(t){return t.id!==id});if(CLOUD)FS.collection('tx').doc(id).delete().catch(fbErr);else saveLocal();render()}
function kname(id,fb){var k=S.cfg.kar.filter(function(x){return x.id===id})[0];return k?k.nama:(fb||'–')}

function viewRing(){
  var P=S.tx.filter(inP),tot=0,m=0,mo=0,ms=0,mos=0,by={};
  P.forEach(function(t){tot+=t.harga;if(t.tp==='motor'){m++;ms+=t.harga}else if(t.tp==='mobil'){mo++;mos+=t.harga}var b=by[t.jn]||(by[t.jn]={n:0,s:0});b.n++;b.s+=t.harga});
  var upah=0;S.cfg.kar.forEach(function(k){var s=0;P.forEach(function(t){if(t.kid===k.id)s+=t.harga});upah+=s*(k.persen||0)/100});
  var h='<div class="chips">'+[['day','Hari ini'],['month','Bulan ini'],['all','Semua']].map(function(c){return '<button class="chip'+(ui.per===c[0]?' on':'')+'" data-a="per" data-v="'+c[0]+'">'+c[1]+'</button>'}).join('')+'</div>';
  h+='<div class="grid"><div class="kpi big"><small>Total pemasukan</small><b>'+R(tot)+'</b><small>'+P.length+' kali cuci</small></div>'
   +'<div class="kpi"><small>Motor masuk</small><b>'+m+'</b><small>rata-rata '+R(m?ms/m:0)+' / motor</small></div>'
   +'<div class="kpi"><small>Mobil masuk</small><b>'+mo+'</b><small>rata-rata '+R(mo?mos/mo:0)+' / mobil</small></div>'
   +'<div class="kpi"><small>Upah karyawan</small><b>'+R(upah)+'</b></div>'
   +'<div class="kpi"><small>Pengeluaran</small><b>'+R(exSum())+'</b></div>'
   +'<div class="kpi"><small>Laba bersih</small><b>'+R(tot-upah-exSum())+'</b><small>setelah upah &amp; biaya</small></div></div>';
  var names=Object.keys(by);
  h+=payCard(P);h+='<h2>Per jenis cuci</h2><div class="card">'+(names.length?'<table><tr><th>Jenis</th><th>Jumlah</th><th>Total</th><th>Rata-rata</th></tr>'+names.map(function(n){var b=by[n];return '<tr><td>'+esc(n)+'</td><td>'+b.n+'</td><td>'+R(b.s)+'</td><td>'+R(b.s/b.n)+'</td></tr>'}).join('')+'</table>':'<div class="empty">Belum ada cucian pada periode ini.</div>')+'</div>';
  var days=[],i;for(i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  var vals=days.map(function(d){var k=ymd(d),s=0;S.tx.forEach(function(t){if(t.tgl===k)s+=t.harga});return s}),mx=Math.max.apply(null,vals.concat([1]));
  h+='<h2>7 hari terakhir</h2><div class="card"><div class="bars">'+vals.map(function(v,j){return '<div title="'+R(v)+'"><i style="height:'+Math.round(v/mx*70)+'px"></i>'+days[j].getDate()+'</div>'}).join('')+'</div></div>';
  var low=S.cfg.sabun.filter(function(s){return s.stok<=s.min});
  if(low.length)h+='<h2>Stok sabun menipis</h2><div class="card">'+low.map(function(s){return '<div class="item"><span>'+esc(s.nama)+'</span><span><span class="tag">sisa '+s.stok+' '+esc(s.satuan)+'</span></span></div>'}).join('')+'</div>';
  h+=waBox();
  return bkWarn()+h;
}
var PAYS=[['tunai','Tunai'],['qris','QRIS'],['transfer','Transfer']];
function payName(p){return p==='qris'?'QRIS':p==='transfer'?'Transfer':'Tunai'}
function paySum(P){var o={tunai:0,qris:0,transfer:0};P.forEach(function(t){o[t.pay==='qris'||t.pay==='transfer'?t.pay:'tunai']+=t.harga});return o}
function payCard(P){var o=paySum(P);return '<h2>Berdasarkan pembayaran</h2><div class="card"><div class="item"><span>Tunai</span><span class="r">'+R(o.tunai)+'</span></div><div class="item"><span>QRIS</span><span class="r">'+R(o.qris)+'</span></div><div class="item"><span>Transfer</span><span class="r">'+R(o.transfer)+'</span></div></div>'}
function kmbInfo(){var f=ui.form,h=Number(f.harga)||0,b=Number(f.bayar);if(f.pay!=='tunai'||f.bayar==='')return '';return b>=h?'Kembalian: <b>'+R(b-h)+'</b>':'<span style="color:var(--warn)">Kurang <b>'+R(h-b)+'</b></span>'}
function payRows(t){if(!t.pay)return '';var r='<div class="rw"><span>Bayar</span><span>'+payName(t.pay)+'</span></div>';if(t.pay==='tunai'&&t.bayar>t.harga)r+='<div class="rw"><span>Tunai</span><span>'+R(t.bayar)+'</span></div><div class="rw"><span>Kembali</span><span>'+R(t.bayar-t.harga)+'</span></div>';return r}
function payText(t){if(!t.pay)return '';var r='\nBayar: '+payName(t.pay);if(t.pay==='tunai'&&t.bayar>t.harga)r+='\nTunai: '+R(t.bayar)+'\nKembali: '+R(t.bayar-t.harga);return r}
function payBox(){
  var f=ui.form,h='<label>Metode bayar</label><div class="paychips">'+PAYS.map(function(p){return '<button class="chip'+(f.pay===p[0]?' on':'')+'" data-a="pay" data-v="'+p[0]+'">'+p[1]+'</button>'}).join('')+'</div>';
  if(f.pay==='tunai'){
    var tot=Number(f.harga)||0;
    h+='<label>Uang diterima (Rp), kosongkan jika uang pas</label><input type="number" inputmode="numeric" data-f="bayar" placeholder="Contoh: 50000" value="'+esc(f.bayar)+'">'
     +'<div class="paychips" style="margin-top:8px">'+[tot,20000,50000,100000].filter(function(v,i,a){return v>0&&a.indexOf(v)===i}).map(function(v,i){return '<button class="chip" data-a="uang" data-v="'+v+'">'+(i===0&&v===tot?'Uang pas':R(v))+'</button>'}).join('')+'</div>'
     +'<div id="kmb" style="font-size:16px;margin-top:10px">'+kmbInfo()+'</div>';
  }else if(f.pay==='qris'){
    h+='<button class="btn sec full" style="margin-top:8px" data-a="qris">Tampilkan QRIS ('+R(Number(f.harga)||0)+')</button>';
  }
  return h;
}
function showQris(){var h=Number(ui.form.harga)||0,o=$('#qov');o.innerHTML='<div style="color:#fff;font-size:22px;font-weight:700;text-align:center">Total bayar: '+R(h)+'</div><img src="qris.png" alt="QRIS Nath Wash"><div style="color:#CFE0FA;font-size:13px;text-align:center">Pelanggan mengisi nominal sendiri, pastikan sesuai total.</div><button class="btn" data-a="qtutup">Tutup</button>';o.style.display='flex'}
function viewCuci(){
  var f=ui.form,T=S.cfg.tarif;
  var h=strukBox()+'<h2>Catat cuci baru</h2><div class="card"><label>Tanggal</label><input type="date" data-f="tgl" value="'+f.tgl+'">'
   +'<label>Jenis</label><select data-f="jenis">'+T.map(function(t){return '<option value="'+t.id+'"'+(f.jenis===t.id?' selected':'')+'>'+esc(t.nama)+' ('+R(t.harga)+')</option>'}).join('')+'</select>'
   +'<label>Harga (bisa diubah sesuai tingkat kekotoran)</label><input type="number" inputmode="numeric" data-f="harga" value="'+f.harga+'">'

function startCloud(){
  var U='https://www.gstatic.com/firebasejs/10.12.2/';
  loadJS(U+'firebase-app-compat.js').then(function(){return Promise.all([loadJS(U+'firebase-auth-compat.js'),loadJS(U+'firebase-firestore-compat.js')])}).then(function(){
    firebase.initializeApp({apiKey:NW_FB.apiKey,authDomain:NW_FB.authDomain,projectId:NW_FB.projectId,appId:NW_FB.appId});
    AU=firebase.auth();FS=firebase.firestore();
    try{FS.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
    AU.onAuthStateChanged(onUser);
  }).catch(function(e){ui.auth='err';ui.err='Tidak bisa memuat layanan cloud. Pastikan internet aktif, lalu muat ulang.';render()});
}
function unsub(){UN.forEach(function(f){try{f()}catch(e){}});UN=[]}
function onUser(u){
  unsub();me=u;
  if(!u){S={cfg:JSON.parse(JSON.stringify(DEF)),tx:[],ex:[]};ui.auth='login';render();return}
  ROLE=String(u.email||'').toLowerCase()===String(NW_FB.ownerEmail||'').toLowerCase()?'owner':'kasir';
  ui.auth='ready';ui.tab=ROLE==='owner'?'ring':'cuci';

function listen(){
  UN.push(FS.doc('nw/cfg').onSnapshot(function(d){
    if(d.exists){var x=JSON.parse(JSON.stringify(d.data()));S.cfg.tarif=normT(x.tarif);S.cfg.kar=x.kar||[];S.cfg.wa=x.wa||'';S.cfg.kasir=x.kasir||''}
    else if(ROLE==='owner'){FS.doc('nw/cfg').set({tarif:S.cfg.tarif,kar:S.cfg.kar,wa:S.cfg.wa||'',kasir:S.cfg.kasir||''}).catch(fbErr)}
    renderSoon()},fbErr));
  UN.push(FS.doc('nw/sabun').onSnapshot(function(d){if(d.exists){S.cfg.sabun=JSON.parse(JSON.stringify(d.data())).sabun||[]}renderSoon()},fbErr));
  var q=FS.collection('tx');if(ROLE!=='owner')q=q.where('uid','==',me.uid);
  UN.push(q.onSnapshot(function(s2){S.tx=s2.docs.map(function(d){var x=JSON.parse(JSON.stringify(d.data()));x.id=d.id;return x});renderSoon()},fbErr));
  if(ROLE==='owner')UN.push(FS.collection('ex').onSnapshot(function(s2){S.ex=s2.docs.map(function(d){var x=JSON.parse(JSON.stringify(d.data()));x.id=d.id;return x});renderSoon()},fbErr));
}
function pushAll(){
  var ops=[['nw/cfg',{tarif:S.cfg.tarif,kar:S.cfg.kar,wa:S.cfg.wa||'',kasir:S.cfg.kasir||''}],['nw/sabun',{sabun:S.cfg.sabun}]];
  S.tx.forEach(function(t){ops.push(['tx/'+t.id,t])});S.ex.forEach(function(e){ops.push(['ex/'+e.id,e])});
  var p=Promise.resolve();
  for(var i=0;i<ops.length;i+=400){(function(ch){p=p.then(function(){var b=FS.batch();ch.forEach(function(o){b.set(FS.doc(o[0]),JSON.parse(JSON.stringify(o[1])))});return b.commit()})})(ops.slice(i,i+400))}
  return p.then(function(){toast('Data lama dipindahkan ke cloud')}).catch(fbErr);
}

  if(c==='auth/unauthorized-domain')return 'Domain belum diizinkan di Firebase (lihat panduan)';

  ui.dirty=false;
}
function renderSoon(){var a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&$('#app').contains(a))ui.dirty=true;else render()}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='lg-p')doLogin()});
window.addEventListener('online',function(){render()});window.addEventListener('offline',function(){render()});
document.addEventListener('focusout',function(){if(ui.dirty)setTimeout(function(){var a=document.activeElement;if(!(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')))render()},50)});
document.addEventListener('click',function(e){try{onClick(e)}catch(err){toast('Error: '+(err&&err.message||err))}});
function onClick(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,v=b.dataset.v;
  if(a==='menu'){menu(true)}
  else if(a==='menux'){menu(false)}
  else if(a==='qmenu'){menu(false);var o=$('#qov');o.innerHTML='<div style="color:#fff;font-size:20px;font-weight:700;text-align:center">QRIS Nath Wash</div><img src="qris.png" alt="QRIS Nath Wash"><div style="color:#CFE0FA;font-size:13px;text-align:center">Pelanggan mengisi nominal sendiri.</div><button class="btn" data-a="qtutup">Tutup</button>';o.style.display='flex'}
  else if(a==='logout'){menu(false);if(AU)AU.signOut()}
  else if(a==='tab'){menu(false);ui.tab=v;ui.del=null;render();window.scrollTo(0,0)}
  else if(a==='per'){ui.per=v;render()}
  else if(a==='catat'){
    var f=ui.form,t=S.cfg.tarif.filter(function(x){return x.id===f.jenis})[0],h=Number(f.harga);
    if(!t||!(h>0)){toast('Isi harga lebih dari 0');return}
    var pay=f.pay||'tunai',bayar=0;
    if(pay==='tunai'&&f.bayar!==''&&f.bayar!=null){bayar=Number(f.bayar);if(!(bayar>=h)){toast('Uang diterima kurang dari harga');return}}
    var pl=(f.plat||'').trim();ui.form.plat='';ui.form.bayar='';var id='t'+Date.now();addTx({id:id,pay:pay,bayar:(pay==='tunai'&&bayar>0)?bayar:0,ts:Date.now(),tgl:f.tgl||ymd(new Date()),jn:t.nama,tp:t.tp,harga:h,kid:f.kid||'',kn:f.kid?kname(f.kid):'',plat:pl,ksr:ksrName(),uid:me?me.uid:'',no:'NW-'+(f.tgl||ymd(new Date())).replace(/-/g,'').slice(2)+'-'+p2(new Date().getHours())+p2(new Date().getMinutes())+p2(new Date().getSeconds())});toast('Cucian dicatat')
  }
  else if(a==='deltx'||a==='delsabun'||a==='delkar'||a==='delex'){
    if(ui.del!==v){ui.del=v;render();clearTimeout(ui.dt);ui.dt=setTimeout(function(){ui.del=null;render()},3000);return}
    ui.del=null;
    if(a==='deltx')delTx(v);
    else if(a==='delex')delEx(v);
    else if(a==='delsabun'){S.cfg.sabun=S.cfg.sabun.filter(function(x){return x.id!==v});saveCfg()}
    else{S.cfg.kar=S.cfg.kar.filter(function(x){return x.id!==v});saveCfg()}
  }
  else if(a==='pakai'||a==='masuk'){
    var n=Number(ui.qty[v]);if(!(n>0)){toast('Isi jumlah dulu');return}
    S.cfg.sabun.forEach(function(s){if(s.id===v)s.stok=Math.max(0,Math.round((s.stok+(a==='masuk'?n:-n))*100)/100)});ui.qty[v]='';saveCfg()
  }
  else if(a==='addsabun'){
    var nm=$('#sn').value.trim();if(!nm){toast('Isi nama item');return}
    S.cfg.sabun.push({id:uid(),nama:nm,stok:Number($('#ss').value)||0,satuan:$('#su').value.trim()||'pcs',min:Number($('#sm').value)||0});saveCfg();toast('Item ditambahkan')
  }
  else if(a==='pay'){ui.form.pay=v;if(v!=='tunai')ui.form.bayar='';render()}
  else if(a==='uang'){ui.form.bayar=v;render()}
  else if(a==='qris'){showQris()}
  else if(a==='qtutup'){$('#qov').style.display='none'}
  else if(a==='login'){doLogin()}
  else if(a==='reload'){location.reload()}
  else if(a==='wr'){ui.wr=v;render()}
  else if(a==='backup'){doBackup()}
  else if(a==='struk'){ui.struk=v;render();window.scrollTo(0,0)}
  else if(a==='tutup'){ui.struk=null;render()}
  else if(a==='cetak'){try{window.print()}catch(e){toast('Cetak tidak tersedia, pakai tangkapan layar')}}
  else if(a==='addex'){
    var jm=Number(ui.ef.jml),kt=(ui.ef.ket||'').trim();if(!kt||!(jm>0)){toast('Isi keterangan dan jumlah');return}
    addEx({id:'e'+Date.now(),ts:Date.now(),tgl:ui.ef.tgl||ymd(new Date()),ket:kt,jml:jm});ui.ef.ket='';ui.ef.jml='';toast('Biaya dicatat')
  }
  else if(a==='addkar'){
    var kn=$('#kn').value.trim();if(!kn){toast('Isi nama karyawan');return}
    S.cfg.kar.push({id:uid(),nama:kn,persen:Number($('#kp').value)||0});saveCfg();toast('Karyawan ditambahkan')
  }
}
document.addEventListener('input',function(e){
  var k=e.target.dataset&&e.target.dataset.f;if(!k)return;
  if(k.indexOf('qty:')===0){ui.qty[k.slice(4)]=e.target.value}
  else if(k==='sn'){ui.sn=e.target.value}
  else if(k.indexOf('ef:')===0){ui.ef[k.slice(3)]=e.target.value}
  else if(k.indexOf(':')<0){ui.form[k]=e.target.value;if(k==='bayar'||k==='harga'){var kb=$('#kmb');if(kb)kb.innerHTML=kmbInfo()}}
});
document.addEventListener('change',function(e){
  var k=e.target.dataset&&e.target.dataset.f;if(!k)return;var v=e.target.value;
  if(k==='jenis'){var t=S.cfg.tarif.filter(function(x){return x.id===v})[0];ui.form.jenis=v;ui.form.harga=t?t.harga:0;render()}
  else if(k==='harga'){render()}
  else if(k==='restore'){doRestore(e.target)}
  else if(k.indexOf('tarif:')===0){S.cfg.tarif.forEach(function(t){if(t.id===k.slice(6))t.harga=Number(v)||0});saveCfg()}
  else if(k==='wa'){S.cfg.wa=v;saveCfg()}
  else if(k==='kasir'){S.cfg.kasir=v.trim();saveCfg();toast('Nama kasir disimpan')}
  else if(k==='sn'){ui.sn=v;render()}
  else if(k.indexOf('persen:')===0){S.cfg.kar.forEach(function(x){if(x.id===k.slice(7))x.persen=Math.min(100,Math.max(0,Number(v)||0))});saveCfg()}
});
if(!CLOUD)loadLocal();render();if(CLOUD)startCloud();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

</script>
</body>
</html>
